{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/forgotpassword.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Taman|Forgotpassword</title>
</head>

<body>

  <div class="Login-Container">
    <div class="container directContainer text-center">

      <div class="row ">
        <div class="col ">
          <div class="LogoDiv">
            <h1 class="LogoText">TVMVN</h1>
            <p class="Header">TVMVN</p>
            <p class="details">Please fill in your details correctly and carefully to access your account.</p>
          </div>
          {% if messages %}
          <div class="messages mb-4">
            {% for message in messages %}
            <div
              class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show"
              role="alert" style="border-radius: 12px; font-size: 14px;">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
          </div>
          {% endif %}
          <form class="loginForm" method="POST" action="{% url 'forgot-password' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Email Address</label>
              <input type="email" name="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                placeholder="johndoe@gmail.com" required>
            </div>
            <div>
              <button type="submit" class="btn loginBtn btn-primary">Reset Password</button>
            </div>
            <p class="loginbutton"> <a href="{% url 'login' %}"> Back to login page </a></p>
          </form>
        </div>
        <!-- <div class="col teamImage">
                <img class="illustration" width="450px" height="633px"  src="{% static 'images/DRIP_20.png' %}" alt="">
              </div> -->

      </div>
    </div>
  </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="{% static 'js/index.js' %}"></script>
</body>

</html>
