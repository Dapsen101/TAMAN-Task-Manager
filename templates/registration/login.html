<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>TAMAN|Login</title>
</head>

<body>
    <div class="Login-Container">
        <div class="container directContainer text-center">
            <div class="row">
                <div class="col">
                    <div class="LogoDiv">
                        <h1 class="LogoText">TAMAN</h1>
                        <p class="Header">TAMAN</p>
                        <p class="details">Please fill in your details correctly and carefully to access your account.
                        </p>
                    </div>
                    {% if messages %}
                    <div class="messages mb-4">
                        {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show"
                            role="alert" style="border-radius: 12px; font-size: 14px;">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    <form class="loginForm" method="POST" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" placeholder="johndoe" name="username"
                                id="exampleInput1" aria-describedby="emailHelp" required>
                        </div>
                        <div class="mb-3 passwordField">
                            <label for="exampleInputPassword1" class="form-label">Password</label>
                        
                            <div class="passwordWrapper">
                                <input placeholder="......" type="password"
                                    class="form-control"
                                    name="password"
                                    id="passwordInput"
                                    required>
                        
                                    <span class="togglePassword" onclick="togglePassword()">
                                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                            <circle cx="12" cy="12" r="3"/>
                                        </svg> 
                                    </span>                           
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                    <label class="form-check-label" for="exampleCheck1">Remember Me</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <p class="forgotPassword"><a href="{% url 'forgot-password' %}">Forgot Password?</a></p>
                            </div>
                        </div>
                        <div>
                            <button type="submit" class="btn loginBtn btn-primary">Login</button>
                            <button type="button" class="btn loginGgleBtn btn-primary">
                                <img class="GgleIcon" src="{% static 'images/Google-icon.png' %}" alt="Google Icon">
                                Login with Google
                            </button>
                        </div>
                        <p class="SignUpButton"> <a href="{% url 'register' %}">Don't have an account? Sign Up</a></p>
                    </form>
                </div>
                <div class="col teamImage">

                    <svg class="illustration" viewBox="0 0 260 200" width="100%" height="100%">
                    
                    <rect x="50" y="30" width="160" height="150" rx="12"
                    fill="#fdf5e9" stroke="#14532D" stroke-width="3"/>
                    
                    <rect x="105" y="15" width="50" height="20" rx="5"
                    fill="#14532D"/>
                    
                    <g class="task task1">
                    <rect x="70" y="70" width="14" height="14" fill="none" stroke="#14532D" stroke-width="2"/>
                    <line x1="95" y1="77" x2="175" y2="77" stroke="#14532D" stroke-width="3"/>
                    <path d="M72 77 L76 81 L82 73" class="check check1"/>
                    </g>
                    
                    <g class="task task2">
                    <rect x="70" y="100" width="14" height="14" fill="none" stroke="#14532D" stroke-width="2"/>
                    <line x1="95" y1="107" x2="175" y2="107" stroke="#14532D" stroke-width="3"/>
                    <path d="M72 107 L76 111 L82 103" class="check check2"/>
                    </g>
                    
                    <g class="task task3">
                    <rect x="70" y="130" width="14" height="14" fill="none" stroke="#14532D" stroke-width="2"/>
                    <line x1="95" y1="137" x2="175" y2="137" stroke="#14532D" stroke-width="3"/>
                    <path d="M72 137 L76 141 L82 133" class="check check3"/>
                    </g>
                    
                    </svg>
                    
                    </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="{% static 'js/index.js' %}"></script>
    <script>
        function togglePassword(){
            const password = document.getElementById("passwordInput");
            const eye = document.getElementById("eyeIcon");

            if(password.type === "password"){
                password.type = "text";
                eye.style.stroke = "#14532D";
            }else{
                password.type = "password";
                eye.style.stroke = "#6B7280";
            }
        }
    </script>
</body>

</html>
