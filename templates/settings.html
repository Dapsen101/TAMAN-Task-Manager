<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Task Manager | Settings</title>
    <link rel="stylesheet" href="{% static 'css/settings.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Montserrat:wght@100..900&family=Poppins:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body{
        background-color:#f3ddbe;
        font-family:"Montserrat", sans-serif;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        }

        .settingsPage{
        background:#fdf5e9;
        padding:40px;
        border-radius:20px;
        width:400px;
        box-shadow:0 10px 25px rgba(0,0,0,0.1);
        }

        .settings-option{
        display:flex;
        align-items:center;
        gap:15px;
        padding:15px;
        margin-bottom:15px;
        border-radius:12px;
        background:#ffffff;
        transition:0.25s ease;
        cursor:pointer;
        }

        .settings-option:hover{
        transform:translateY(-3px);
        box-shadow:0 6px 15px rgba(0,0,0,0.08);
        }

        .settings-btn{
        border:none;
        background:#14532D;
        color:white;
        padding:10px 12px;
        border-radius:10px;
        font-size:18px;
        }

        .settings-option h5{
        margin:0;
        font-family:"Baloo Bhaijaan 2";
        color:#14532D;
        }

        .settings-link{
        display:flex;
        align-items:center;
        gap:15px;
        text-decoration:none;
        }

        .dark{
        background:#18181b;
        color:white;
        }

        .dark .settingsPage{
        background:#27272a;
        }

        .dark .settings-option{
        background:#3f3f46;
        }

        .dark .settings-option h5{
        color:white;
        }
    </style>

</head>
    <body>
            <div class="settingsPage container">

            <div class="settings-option dark-mode">
                <button class="settings-btn">
                    <span class="iconamoon--mode-dark-light"></span>
                </button>
                <h5>Dark Mode</h5>
            </div>

            <div class="settings-option light-mode">
                <button class="settings-btn">
                    <span class="ic--round-light-mode"></span>
                </button>
                <h5>Light Mode</h5>
            </div>

            <div class="settings-option edit-profile">
                <a href="{% url 'profile' %}" class="settings-link">
                    <button class="settings-btn">
                        <span class="ic--round-light-mode"></span>
                    </button>
                </a>
                <h5>Edit Profile</h5>
            </div>

        </div>

    <script src="{% static 'js/settings.js' %}"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

        <script>
            const darkBtn = document.querySelector(".dark-mode");
const lightBtn = document.querySelector(".light-mode");

darkBtn.addEventListener("click", () => {
    document.body.classList.add("dark");
    localStorage.setItem("theme","dark");
});

lightBtn.addEventListener("click", () => {
    document.body.classList.remove("dark");
    localStorage.setItem("theme","light");
});


window.onload = () => {
    const savedTheme = localStorage.getItem("theme");

    if(savedTheme === "dark"){
        document.body.classList.add("dark");
    }
}
        </script>

    </body>
</html>
