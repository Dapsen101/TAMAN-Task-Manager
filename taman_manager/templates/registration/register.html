<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- <link rel="stylesheet" href="{% static 'css/signup.css' %}"> -->
    <!-- <link rel="stylesheet" href="{% static 'css/style.css' %}"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Taman|Signup</title>
    <style>
        /* ===== Reset ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    background-color: #f3ddbe;   /* warm cream */
    font-family: "Montserrat", sans-serif;
    color: #3F3F46;
    min-height: 100vh;
}

.Login-Container {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3% 0;
}

.directContainer {
    background-color: #fdf5e9;   /* soft ivory */
    border-radius: 25px;
    padding: 40px 30px;
    box-shadow: 0 10px 30px rgba(20, 83, 45, 0.08);
    max-width: 650px;
    width: 95%;
}

.LogoDiv {
    text-align: center;
    margin-bottom: 30px;
}

.LogoText {
    font-family: "Baloo Bhaijaan 2", serif;
    font-weight: 700;
    font-size: 36px;
    color: #14532D; 
    margin-bottom: 5px;
}

.Header {
    font-size: 20px;
    color: #14532D;
    margin-bottom: 10px;
}

.details {
    color: #6B7280;
    font-size: 14px;
}

.loginForm {
    width: 100%;
}

.form-label {
    font-weight: 500;
    color: #14532D;
}

.form-control {
    border-radius: 12px;
    border: 1px solid #D6D3D1;
    padding: 10px;
    background-color: #F9FAFB;
    color: #3F3F46;
    transition: 0.2s ease;
}

.form-control:focus {
    border-color: #4ADE80;
    box-shadow: 0 0 0 0.2rem rgba(74, 222, 128, 0.25);
    background-color: #ffffff;
}

.form-check-label {
    margin-left: 5px;
    color: #14532D;
}

.loginBtn {
    width: 100%;
    border-radius: 12px;
    font-size: 16px;
    font-family: "Baloo Bhaijaan 2", serif;
    background-color: #14532D !important;
    border: none !important;
    color: white !important;
    padding: 10px;
    transition: 0.3s ease;
}

.loginBtn:hover {
    background-color: #0F3D23 !important;
}

.loginGgleBtn {
    width: 100% !important;
    margin-top: 15px !important;
    border-radius: 12px !important;
    background-color: #F3F4F6 !important;
    color: #3F3F46 !important;
    border: 1px solid #D6D3D1 !important;
    padding: 10px;
    transition: 0.3s ease;
}

.loginGgleBtn:hover {
    background-color: #E5E7EB !important;
}

.GgleIcon {
    margin-right: 6px;
    vertical-align: middle;
}

.SignUpButton {
    margin-top: 20px;
    text-align: center;
}

.SignUpButton > a {
    color: #14532D;
    text-decoration: none;
    font-weight: 500;
}

.SignUpButton > a:hover {
    text-decoration: underline;
}

/* Responsiveness */
@media (max-width: 768px) {
    .directContainer {
        padding: 30px 20px;
    }

    .LogoText {
        font-size: 28px;
    }
}
    </style>
</head>
<body>
    <div class="Login-Container">
        <div class="container directContainer text-center">
            <div class="row">
                <div class="col">
                    <div class="LogoDiv">
                        <h1 class="LogoText">TVMVN</h1>
                        <p class="Header">TVMVN</p>
                        <p class="details">Please fill in your details correctly and carefully to access your account.</p>
                    </div>
                    <form class="loginForm" method="POST" action="{% url 'register' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="firstname" class="form-label">Firstname</label>
                            <input type="text" class="form-control" name="firstname" id="firstname" placeholder="John" required>
                        </div>
                        <div class="mb-3">
                            <label for="lastname" class="form-label">Lastname</label>
                            <input type="text" class="form-control" name="lastname" id="lastname" placeholder="Doe" required>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" id="username" placeholder="johndoe" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone number</label>
                            <input type="tel" class="form-control" name="phone" id="phone" placeholder="+234800000000" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" name="email" id="email" placeholder="johndoe@gmail.com" required>
                            <div id="emailHelp" class="form-text" style="color: rgb(133, 132, 131);">We'll never share your email with anyone else.</div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" id="password" required placeholder="......">
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" name="confirm_password" id="confirm_password" required placeholder="......">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label" for="remember">Remember Me</label>
                        </div>

                        <div>
                            <button type="submit" class="btn loginBtn btn-primary">Signup</button>
                            <button type="button" class="btn loginGgleBtn btn-primary">
                                <img class="GgleIcon" src="../assets/images/Google-icon.png" alt="">
                                Signup with Google
                            </button>
                        </div>

                        <p class="SignUpButton"> <a href= "{% url 'login' %}"> Have an account? Login</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./public/js/index.js"></script>
</body>
</html>
