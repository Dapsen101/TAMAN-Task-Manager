<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Taman|Login</title>
</head>

<body>
    <div class="Login-Container">
        <div class="container directContainer text-center">
            <div class="row">
                <div class="col">
                    <div class="LogoDiv">
                        <h1 class="LogoText">TVMVN</h1>
                        <p class="Header">TVMVN</p>
                        <p class="details">Please fill in your details correctly and carefully to access your account.
                        </p>
                    </div>
                    {% if messages %}
                    <div class="messages mb-4">
                        {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show"
                            role="alert" style="border-radius: 12px; font-size: 14px;">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    <form class="loginForm" method="POST" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" placeholder="johndoe" name="username"
                                id="exampleInput1" aria-describedby="emailHelp" required>
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Password</label>
                            <input placeholder="......" type="password" class="form-control" name="password"
                                id="exampleInputPassword1" required>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                    <label class="form-check-label" for="exampleCheck1">Remember Me</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <p class="forgotPassword"><a href="{% url 'forgot-password' %}">Forgot Password?</a></p>
                            </div>
                        </div>
                        <div>
                            <button type="submit" class="btn loginBtn btn-primary">Login</button>
                            <button type="submit" class="btn loginGgleBtn btn-primary">
                                <img class="GgleIcon" src="{% static 'images/Google-icon.png' %}" alt="Google Icon">
                                Login with Google
                            </button>
                        </div>
                        <p class="SignUpButton"> <a href="{% url 'register' %}">Don't have an account? Sign Up</a></p>
                    </form>
                </div>
                <div class="col teamImage">
                    <img class="illustration" width="450px" height="550px" src="{% static 'images/DRIP_20.png' %}"
                        alt="">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="{% static 'js/index.js' %}"></script>
</body>

</html>
