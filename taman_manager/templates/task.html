<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Your Tasks</h2>
    <ul>
      {% for task in tasks %}
        <li>{{ task.name }} - {{ task.milestone }} - {% if task.completion_status %} Completed {% else %} Not Completed {% endif %}</li>
      {% endfor %}
    </ul>
</body>
</html>
