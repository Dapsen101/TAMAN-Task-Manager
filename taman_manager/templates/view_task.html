<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-sand: #f3ddbe;
            --card-cream: #fdf5e9;
            --deep-green: #2f5d50;
            --soft-green: #4f7c6e;
            --light-green: #dfeee8;
            --text-muted: #6b7280;
            --danger: #b84a4a;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-sand);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: auto;
            background: var(--card-cream);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            box-sizing: border-box;
    }

        h1 {
            margin-bottom: 30px;
            color: var(--deep-green);
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        select, button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-family: inherit;
        }

        select:focus {
            outline: none;
            border-color: var(--deep-green);
        }

        button {
            background: var(--deep-green);
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: var(--soft-green);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            /* table-layout: fixed; */
        }

        thead {
            background: var(--light-green);
        }

        th, td {
            padding: 14px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            color: var(--deep-green);
            font-weight: 600;
            font-size: 14px;
        }

        tbody tr {
            border-bottom: 1px solid #e5e5e5;
        }

        tbody tr:hover {
            background: #f1f6f4;
        }

        .task-name {
            max-width: 250px;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }

        .task-name.expanded {
            white-space: normal;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--deep-green);
            cursor: pointer;
            font-size: 12px;
            margin-left: 6px;
            padding: 0;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .created {
            background: #e6f4ef;
            color: #2f5d50;
        }

        .progress {
            background: #fff3cd;
            color: #856404;
        }

        .completed {
            background: #d4edda;
            color: #155724;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 6px;
            background: var(--soft-green);
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-danger {
            background: var(--danger);
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }


        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .container {
                padding: 25px 15px;
            }
            .filters {
                flex-direction: column;
            }

            .filters select,
            .filters button {
                width: 100%;
            }

            table {
                font-size: 14px;
                table-layout: fixed;
            }

            .btn-small {
                width: 100%;
                margin-top: 6px;
            }
        }

        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            table {
                display: block;
                width: 100%;
                overflow-x: auto;
            }

            th, td {
                white-space: nowrap;
            }

            .task-name {
                max-width: 90px;
            }

            .btn-small {
                width: 100%;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>🌿 My Tasks</h1>

    <form method="GET" class="filters">
        <select name="status">
            <option value="">All Statuses</option>
            <option value="Created" {% if status_filter == 'Created' %}selected{% endif %}>Created</option>
            <option value="In Progress" {% if status_filter == 'In Progress' %}selected{% endif %}>In Progress</option>
            <option value="Completed" {% if status_filter == 'Completed' %}selected{% endif %}>Completed</option>
        </select>

        <select name="category">
            <option value="">All Categories</option>
            <option value="Work" {% if category_filter == 'Work' %}selected{% endif %}>Work</option>
            <option value="Personal" {% if category_filter == 'Personal' %}selected{% endif %}>Personal</option>
            <option value="Shopping" {% if category_filter == 'Shopping' %}selected{% endif %}>Shopping</option>
            <option value="Health" {% if category_filter == 'Health' %}selected{% endif %}>Health</option>
            <option value="Education" {% if category_filter == 'Education' %}selected{% endif %}>Education</option>
            <option value="Other" {% if category_filter == 'Other' %}selected{% endif %}>Other</option>
        </select>

        <button type="submit">Apply</button>
    </form>

    {% if tasks %}
    <table>
        <thead>
            <tr>
                <th>Task</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr>

                <td>
                    <span class="task-name">{{ task.name }}</span>
                    {% if task.name|length > 40 %}
                        <button type="button" class="toggle-btn" onclick="toggleTaskName(this)">see more</button>
                    {% endif %}
                </td>

                <td>
                    <span class="badge 
                        {% if task.status == 'Created' %}created
                        {% elif task.status == 'In Progress' %}progress
                        {% elif task.status == 'Completed' %}completed
                        {% endif %}">
                        {{ task.status }}
                    </span>
                </td>

                <td>
                    <form method="POST" action="{% url 'delete_task' task.id %}">
                        {% csrf_token %}
                        <button type="submit" class="btn-small btn-danger">Delete</button>
                    </form>
                </td>

            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
        <div class="empty">
            No tasks yet. Go create something productive 😌
        </div>
    {% endif %}

</div>

<script>
function toggleTaskName(btn) {
    const span = btn.previousElementSibling;
    span.classList.toggle('expanded');
    btn.textContent = span.classList.contains('expanded') ? 'see less' : 'see more';
}
</script>

</body>
</html>
