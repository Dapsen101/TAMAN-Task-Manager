<html lang="en">
<head>

    <link rel="stylesheet" href="/static/css/teams.css">

<body>
    <div class="TeamsContainer">
       <h1>Team Members</h1>
       <div id="TeamMembers">
           <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              Frontend team
            </button>
            <ul class="dropdown-menu dropdown-menu-dark">
              <li><a class="dropdown-item" href="#">Oba Jomiloju </a></li>
              <li><a class="dropdown-item" href="#">Ayegbusi Oluwanifemi</a></li>
            </ul>
          </div>

          <div class="dropdown2">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              Backend team
            </button>
            <ul class="dropdown-menu dropdown-menu-dark">
              <li><a class="dropdown-item" href="#">Toluwalashe Oluwafemi </a></li>
              <li><a class="dropdown-item" href="#">Aylara Zoe</a></li>
              <li><a class="dropdown-item" href="#">Azeez Michael</a></li>
            </ul>
          </div>

        </div>
        <div class="tasksContainer" id="CreateTaskDiv">
          <button id="createTaskBtn" onclick="CreateTask()">Create new Team</button>
      </div>

        <div class="tasksContainer">
          
          <div class="createTaskContainer" id="createTaskContainer">
              <p>Fill form with details for team to be created</p>
              <form class="taskForm" action="./task.html">
                  <div class="formDetail">
                      <label for="taskTitl">Team Name:</label>
                      <input type="text" placeholder=" Frontend Team" required>
                  </div>
                  <div class="Members">
                    <p>A minimum of 2 members and maximumof 5</p>
                    <div class="formDetail">
                        <label for="taskTitl">Member Username:</label>
                        <input type="text" placeholder="johndoe" required>
                    </div>
                    <div class="formDetail">
                        <label for="taskTitl">Member Username:</label>
                        <input type="text" placeholder="johndoe" required>
                    </div>
                    <div class="formDetail">
                        <label for="taskTitl">Member Username:</label>
                        <input type="text" placeholder="johndoe" required>
                    </div>
                    <div class="formDetail">
                        <label for="taskTitl">Member Username:</label>
                        <input type="text" placeholder="johndoe" required>
                    </div>
                    <div class="formDetail">
                        <label for="taskTitl">Member Username:</label>
                        <input type="text" placeholder="johndoe" required>
                    </div>
                    <div class="formDetail">
                        <label for="taskTitl">Member Username:</label>
                        <input type="text" placeholder="johndoe" required>
                    </div>
                  </div>
                 
                <div class="Milestones">
                  <div class="formDetail">
                      <p>Team Description</p>
                      <p>Describe your team based on what they do</p>
                      <label for="taskTitl">Description</label>
                      <input type="text" placeholder="lorem ipsum" required>
                  </div>
                  
                </div>
                <div class="formDetail">
                  <input class="submitBtn" type="submit"value="Create team">
                </div> 
              </form>
          </div>
      </div>
       </div>

    <script src="./js/teams.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
